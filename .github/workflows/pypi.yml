# Install as .github/workflows/devpi.yml in chaobrain/brainevent.
name: Publish brainevent to Chaobrain devpi

on:
  push:
    tags: ["**"]
  release:
    types: [published]
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish; leave empty to build all branches"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: devpi-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'chaobrain/brainevent' && (github.event_name != 'push' || !github.event.deleted)
    runs-on: [self-hosted, Linux, X64, chaobrain-pypi]
    timeout-minutes: 360
    env:
      PYPI_RUNTIME_DIR: ${{ vars.PYPI_RUNTIME_DIR || '/mnt/16T/ci-runner/chaobrain-pypi' }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tag
        if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: bash
        run: |
          "$PYPI_RUNTIME_DIR/devpi_plugins/.venv/bin/python" \
            "$PYPI_RUNTIME_DIR/devpi_plugins/ci-runner/tasks.py" tag \
            --runtime-dir "$PYPI_RUNTIME_DIR" \
            --repo "$GITHUB_REPOSITORY" --checkout "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --tag "$RELEASE_TAG"
      - name: Build every branch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
        shell: bash
        run: |
          "$PYPI_RUNTIME_DIR/devpi_plugins/.venv/bin/python" \
            "$PYPI_RUNTIME_DIR/devpi_plugins/ci-runner/tasks.py" nightly \
            --runtime-dir "$PYPI_RUNTIME_DIR" \
            --repo "$GITHUB_REPOSITORY" --checkout "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID"